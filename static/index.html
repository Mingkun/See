<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>see · 局域网监控</title>
<style>
  :root { --line:#e3e8ef; --text:#1f2630; --muted:#69737f; --brand:#2563eb; --bg:#f2f5f9; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:860px; margin:0 auto; padding:12px 14px 70px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  header h1 { font-size:17px; }
  .mode { font-size:11px; padding:2px 9px; border-radius:10px; background:#e0e7ff; color:#3730a3; }
  .mode.gw { background:#dcfce7; color:#166534; }
  .cards { display:flex; gap:8px; margin-bottom:12px; }
  .card { flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .card .k { font-size:11px; color:var(--muted); }
  .card .v { font-size:16px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .panel .pt { font-size:13px; font-weight:600; padding:10px 14px 8px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; color:var(--muted); font-weight:500; padding:4px 8px; border-bottom:1px solid var(--line); }
  td { padding:9px 8px; border-bottom:1px solid #f0f3f7; vertical-align:middle; }
  tr.dev { cursor:pointer; }
  tr.dev:active { background:#f6f8fb; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#cbd5e1; margin-right:2px; }
  .dot.on { background:#22c55e; box-shadow:0 0 6px #22c55e; }
  .name { font-weight:600; }
  .sub { font-size:11px; color:var(--muted); }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dn { color:#2563eb; } .up { color:#d97706; }
  .ev { display:flex; gap:10px; padding:8px 14px; border-bottom:1px solid #f0f3f7; font-size:12px; }
  .ev .t { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; font-size:10px; padding:0 6px; border-radius:6px; margin-right:4px; }
  .tag.join { background:#dcfce7; color:#166534; } .tag.offline { background:#fee2e2; color:#991b1b; } .tag.online { background:#dbeafe; color:#1e40af; }
  .bar { background:#eff3f8; border-radius:4px; height:8px; overflow:hidden; margin-top:3px; }
  .bar > i { display:block; height:100%; background:var(--brand); }
  #detail { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100; display:none; align-items:center; justify-content:center; }
  #detail .box { width:min(520px,calc(100vw - 32px)); max-height:84vh; overflow:auto; background:#fff; border-radius:14px; padding:16px; }
  .chart { display:flex; align-items:flex-end; gap:1px; height:70px; margin:8px 0 2px; }
  .chart .b { flex:1; background:#bfdbfe; border-radius:1px 1px 0 0; position:relative; }
  .chart .b i { position:absolute; left:0; right:0; bottom:0; background:#2563eb; border-radius:1px 1px 0 0; }
  .approw { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12px; }
  .approw .an { width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .approw .ab { flex:1; } .approw .av { width:90px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .hint { font-size:11px; color:var(--muted); padding:8px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📡 see · 局域网监控</h1>
    <span class="mode" id="mode">…</span>
  </header>
  <div id="viewMon">
  <div class="cards">
    <div class="card"><div class="k">在线设备</div><div class="v" id="cOn">–</div></div>
    <div class="card"><div class="k">总下载</div><div class="v dn" id="cDn">–</div></div>
    <div class="card"><div class="k">总上传</div><div class="v up" id="cUp">–</div></div>
    <div class="card"><div class="k">今日总流量</div><div class="v" id="cDay">–</div></div>
  </div>
  <div class="panel">
    <div class="pt">设备</div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th></th><th>设备</th><th>厂商</th><th>↓ 速度</th><th>↑ 速度</th><th>今日流量</th></tr></thead>
      <tbody id="devBody"><tr><td colspan="6" class="hint">加载中…</td></tr></tbody>
    </table>
    </div>
    <div class="hint" id="netInfo"></div>
  </div>
  <div style="text-align:center;margin:4px 0 12px"><a href="downloads/see-android-v2.21.apk" style="font-size:12px;color:#2563eb">📱 安卓客户端安装包 v2.14（观察模式）</a></div>
  <div class="panel">
    <div class="pt">动态</div>
    <div id="evBody"><div class="hint">加载中…</div></div>
  </div>
  </div>
  <div id="viewSpeed" style="display:none">
  <div class="panel" id="snapPanel">
    <div class="pt">📸 截图测速</div>
    <div style="padding:10px 14px">
      <div class="hint" style="padding:0 0 8px;display:block">选两张或以上截图（手机流量页/路由器统计页，含累计上传/下载量），自动识别并按时间差算出进/出网速。</div>
      <input type="file" id="snapFiles" accept="image/*" multiple style="font-size:12px">
      <div id="snapRows"></div>
      <button type="button" id="snapCalcBtn" onclick="snapCalc()" style="margin-top:8px;border:1px solid #c7d0dc;background:#fff;border-radius:8px;font-size:12px;padding:5px 14px;color:#2563eb;cursor:pointer">计算网速<button type="button" onclick="snapClear()" style="margin-top:8px;margin-left:8px;border:1px solid #c7d0dc;background:#fff;border-radius:8px;font-size:12px;padding:5px 14px;color:#b02a37;cursor:pointer">🗑 清空</button>
      <div id="snapOut"></div>
    </div>
  </div>
</div>

  </div>
<div style="position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)">
  <button id="tabMon" type="button" onclick="seeTab('mon')" style="flex:1;border:none;background:none;padding:7px 0 9px;font-size:12px;cursor:pointer;color:#2563eb"><span style="font-size:17px;display:block;line-height:1.3">📊</span>监控</button>
  <button id="tabSpd" type="button" onclick="seeTab('spd')" style="flex:1;border:none;background:none;padding:7px 0 9px;font-size:12px;cursor:pointer;color:#69737f"><span style="font-size:17px;display:block;line-height:1.3">📸</span>测速</button>
</div>
<script>
function seeTab(w){
  document.getElementById('viewMon').style.display = w==='mon' ? '' : 'none';
  document.getElementById('viewSpeed').style.display = w==='spd' ? '' : 'none';
  document.getElementById('tabMon').style.color = w==='mon' ? '#2563eb' : '#69737f';
  document.getElementById('tabSpd').style.color = w==='spd' ? '#2563eb' : '#69737f';
  if (w==='mon') loadStatus();
}
</script>
<div id="detail">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <strong id="dTitle" style="font-size:15px">设备</strong>
      <button onclick="closeDetail()" style="border:none;background:none;font-size:22px;cursor:pointer;color:#69737f;line-height:1">×</button>
    </div>
    <div class="sub" id="dInfo"></div>
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin-top:12px">近 90 分钟流量（下/上）</div>
    <div class="chart" id="dChart"></div>
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin-top:10px">应用/目标（近 5 分钟）</div>
    <div id="dApps" class="hint">–</div>
  </div>
</div>

<script>
var curIp = '';
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function fmtSpeed(b){ if(!b||b<1) return '0'; if(b<1024) return b.toFixed(0)+' B/s'; if(b<1048576) return (b/1024).toFixed(1)+' K/s'; return (b/1048576).toFixed(2)+' M/s'; }
function fmtBytes(b){ if(!b) return '0'; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; if(b<1073741824) return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
function fmtTs(t){ var d=new Date(t*1000); return d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); }

function loadStatus(){
  fetch('api/status').then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok) return;
    var m=document.getElementById('mode');
    m.textContent = d.mode==='gateway' ? '网关模式' : '观察模式';
    m.className = 'mode'+(d.mode==='gateway'?' gw':'');
    document.getElementById('cOn').textContent = d.online + '/' + d.devices;
    document.getElementById('cDn').textContent = fmtSpeed(d.total_speed.down);
    document.getElementById('cUp').textContent = fmtSpeed(d.total_speed.up);
    document.getElementById('netInfo').textContent = '网卡 '+d.iface+' · 网段 '+d.subnet+(d.mode!=='gateway'?' · 观察模式只能统计接入/在线；流量统计需在网关设备运行':'');
  }).catch(function(){});
}
function loadDevices(){
  fetch('api/devices').then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok) return;
    var day=0, b=document.getElementById('devBody');
    if(!d.devices.length){ b.innerHTML='<tr><td colspan="6" class="hint">暂未发现设备（等扫描）</td></tr>'; return; }
    var html='';
    d.devices.forEach(function(v){
      day += (v.today.up||0)+(v.today.down||0);
      html+='<tr class="dev" data-ip="'+esc(v.ip)+'">'
        +'<td><span class="dot'+(v.online?' on':'')+'"></span></td>'
        +'<td><div class="name">'+esc(v.hostname||v.ip)+'</div><div class="sub">'+esc(v.ip)+' · '+esc(v.mac)+'</div></td>'
        +'<td class="sub">'+esc(v.vendor||'')+'</td>'
        +'<td class="num dn">'+fmtSpeed(v.speed.down)+'</td>'
        +'<td class="num up">'+fmtSpeed(v.speed.up)+'</td>'
        +'<td class="num">'+fmtBytes((v.today.up||0)+(v.today.down||0))+'</td></tr>';
    });
    b.innerHTML=html;
    document.getElementById('cDay').textContent=fmtBytes(day);
    Array.prototype.forEach.call(b.querySelectorAll('tr.dev'),function(tr){
      tr.addEventListener('click',function(){ openDetail(tr.getAttribute('data-ip')); });
    });
  }).catch(function(){});
}
function loadEvents(){
  fetch('api/events?limit=40').then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok) return;
    var b=document.getElementById('evBody');
    if(!d.events.length){ b.innerHTML='<div class="hint">暂无动态</div>'; return; }
    var html='';
    d.events.forEach(function(e){
      var label={join:'接入',online:'上线',offline:'离线'}[e.type]||e.type;
      html+='<div class="ev"><span class="t">'+fmtTs(e.ts)+'</span>'
        +'<span><span class="tag '+esc(e.type)+'">'+label+'</span>'+esc(e.hostname||e.ip)+' <span class="sub">'+esc(e.ip)+'</span></span></div>';
    });
    b.innerHTML=html;
  }).catch(function(){});
}
function openDetail(ip){ curIp=ip; document.getElementById('detail').style.display='flex'; loadDetail(); }
function closeDetail(){ document.getElementById('detail').style.display='none'; curIp=''; }
function loadDetail(){
  if(!curIp) return;
  fetch('api/device?ip='+encodeURIComponent(curIp)).then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok) return;
    var v=d.device;
    document.getElementById('dTitle').textContent=v.hostname||v.ip;
    document.getElementById('dInfo').textContent=v.ip+' · '+v.mac+(v.vendor?' · '+v.vendor:'')+(v.online?' · 在线':' · 离线')+' · 今日 ↓'+fmtBytes(d.today.down)+' ↑'+fmtBytes(d.today.up);
    var ch=document.getElementById('dChart'), s=d.series||[], n=s.length;
    if(!n){ ch.innerHTML='<div class="hint" style="flex:1">暂无数据（需网关模式）</div>'; }
    else{
      var max=1; s.forEach(function(x){ max=Math.max(max,x.down,x.up); });
      var html='';
      s.forEach(function(x){
        var h=Math.max(3,x.down/max*100), hu=Math.max(2,x.up/max*100);
        html+='<div class="b" style="height:100%"><i style="height:'+h+'%"></i><i style="height:'+hu+'%;background:#d97706;bottom:auto;top:'+(100-hu)+'%"></i></div>';
      });
      ch.innerHTML=html;
    }
    var ab=document.getElementById('dApps'), apps=d.apps||[];
    if(!apps.length){ ab.innerHTML='<div class="hint">暂无应用数据（需网关模式）</div>'; }
    else{
      var mx=Math.max.apply(null,apps.map(function(a){return (a.up||0)+(a.down||0)}))||1;
      ab.innerHTML=apps.map(function(a){
        var w=((a.up+a.down)/mx*100).toFixed(1);
        return '<div class="approw"><div class="an">'+esc(a.app)+'</div><div class="ab"><div class="bar"><i style="width:'+w+'%"></i></div></div><div class="av">↓'+fmtBytes(a.down)+' ↑'+fmtBytes(a.up)+'</div></div>';
      }).join('');
    }
  }).catch(function(){});
}
document.getElementById('detail').addEventListener('click',function(e){ if(e.target===this) closeDetail(); });
loadStatus(); loadDevices(); loadEvents();
setInterval(loadStatus,2000); setInterval(loadDevices,2000); setInterval(loadEvents,5000);
setInterval(function(){ if(curIp) loadDetail(); },3000);
var snapItems = [];
function pad2(n){ return (n<10?'0':'')+n; }
function fmtDT(ms){ var d=new Date(ms); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
document.getElementById('snapFiles').addEventListener('change', function(){
  var fs = Array.prototype.slice.call(this.files || []);
  if (!fs.length) return;
  fs.forEach(function(f){
    var it = { ts: f.lastModified || Date.now(), up: null, down: null, busy: true, err: '', url: URL.createObjectURL(f) };
    snapItems.push(it); renderSnap();
    var fd = new FormData(); fd.append('image', f);
    fetch('api/snapshots/ocr', { method: 'POST', body: fd })
      .then(function(r){ return r.json(); })
      .then(function(d){ it.busy=false; if(d&&d.ok){ it.up=d.up; it.down=d.down; it.upText=d.up_text||''; it.downText=d.down_text||''; } else { it.err=(d&&d.error)||'识别失败'; } renderSnap(); })
      .catch(function(){ it.busy=false; it.err='网络错误'; renderSnap(); });
  });
  this.value='';
});
function snapAttr(v){ return esc(String(v==null?'':v)).split('"').join('&quot;'); }
function snapGuess(up, down){
  var KB=1024, MB=1048576;
  if (down >= 2*MB && up < 100*KB) return '高清视频/大文件下载（视频类App、应用更新、网盘下载）';
  if (down >= 500*KB && up < 50*KB) return '视频播放为主（抖音/B站/长视频，下载为主上传极少）';
  if (down >= 100*KB && up < 30*KB) return '刷短视频/图文feed/网页浏览（朋友圈、微博、浏览器）';
  if (up >= 100*KB && down >= 100*KB) return '双向流量大：视频通话（微信/FaceTime）或直播，也可能是网盘同步';
  if (up >= 50*KB) return '上传为主：发原图视频/云相册备份/直播推流';
  if (down < 10*KB && up < 10*KB) return '待机/后台推送（IM心跳、系统同步）';
  return '一般网络使用（混合场景）';
}
function snapParseBytes(t){
  if(!t) return null;
  var m = String(t).match(/([\d,\.]+)\s*(TB|GB|MB|KB|B|字节)?/i);
  if(!m) return null;
  var num = m[1], unit = (m[2]||'B').toUpperCase();
  if(unit==='字节') unit='B';
  if(num.indexOf(',')>=0){ num = num.split(',').join(''); }
  else { var dots = num.split('.').length-1;
    if(dots>1){ var parts = num.split('.');
      if(parts[parts.length-1].length<=2) num = parts.slice(0,-1).join('')+'.'+parts[parts.length-1];
      else num = num.split('.').join(''); } }
  var v = parseFloat(num);
  if(isNaN(v)) return null;
  var mul = {B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776}[unit];
  return mul ? Math.round(v*mul) : null;
}
function mb(v){ return (v==null||isNaN(v))?'':(v/1048576).toFixed(2); }
function renderSnap(){
  snapItems.sort(function(a,b){ return a.ts-b.ts; });
  var html='';
  snapItems.forEach(function(it,i){
    html+='<div style="display:flex;gap:5px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f3f7;flex-wrap:wrap">'
      +'<img src="'+it.url+'" style="width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid #e3e8ef">'
      +'<input type="datetime-local" step="1" value="'+fmtDT(it.ts)+'" onchange="snapItems['+i+'].ts=new Date(this.value).getTime()" style="flex:1;min-width:150px;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 5px">'
      +'<span class="sub">↑</span><input type="text" placeholder="如1.03GB" value="'+snapAttr(it.upText||(it.up!=null?(it.up/1048576).toFixed(2)+'MB':''))+'" onchange="snapItems['+i+'].upText=this.value;snapItems['+i+'].up=snapParseBytes(this.value)" style="width:88px;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 5px">'
      +'<span class="sub">↓</span><input type="text" placeholder="如14.22GB" value="'+snapAttr(it.downText||(it.down!=null?(it.down/1048576).toFixed(2)+'MB':''))+'" onchange="snapItems['+i+'].downText=this.value;snapItems['+i+'].down=snapParseBytes(this.value)" style="width:88px;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 5px">'
      +(it.busy?'<span class="sub" style="color:#d97706">识别中…</span>':(it.err?'<span class="sub" style="color:#b02a37">'+esc(it.err)+'</span>':''))
      +'</div>';
  });
  document.getElementById('snapRows').innerHTML = html;
}
function snapClear(){
  for (var ci=0;ci<snapItems.length;ci++){ try { URL.revokeObjectURL(snapItems[ci].url); } catch(e){} }
  snapItems = [];
  document.getElementById('snapRows').innerHTML = '';
  document.getElementById('snapOut').innerHTML = '';
  document.getElementById('snapFiles').value = '';
}
function snapCalc(){
  var o = document.getElementById('snapOut');
  var its = snapItems.filter(function(x){ return x.ts && x.up!=null && !isNaN(x.up) && x.down!=null && !isNaN(x.down); });
  its.sort(function(a,b){ return a.ts-b.ts; });
  if (its.length < 2){ o.innerHTML = '<div class="hint" style="padding:8px 0 0;display:block">需要至少两张已识别出 ↑↓ 数值的截图</div>'; return; }
  var html = '<table style="margin-top:10px"><thead><tr><th>区间</th><th>时长</th><th>↑ 上传速度</th><th>↓ 下载速度</th></tr></thead><tbody>';
  var rows = 0;
  for (var i=1;i<its.length;i++){
    var a=its[i-1], b=its[i], dt=(b.ts-a.ts)/1000;
    if (dt <= 0) continue;
    var du=b.up-a.up, dd=b.down-a.down;
    var note='';
    if (du<0||dd<0) note=' <span class="sub" style="color:#b02a37">(计数器清零?)</span>';
    html+='<tr><td class="sub">'+pad2(new Date(a.ts).getHours())+':'+pad2(new Date(a.ts).getMinutes())+' → '+pad2(new Date(b.ts).getHours())+':'+pad2(new Date(b.ts).getMinutes())+'</td>'
      +'<td class="num">'+(dt>=60?(dt/60).toFixed(1)+'分':Math.round(dt)+'秒')+'</td>'
      +'<td class="num up">'+(du<0?'-':fmtSpeed(du/dt))+'</td>'
      +'<td class="num dn">'+(dd<0?'-':fmtSpeed(dd/dt))+'</td>'+note+'</tr>'
      +((du>=0&&dd>=0&&dt>0)?'<tr><td colspan="4" class="sub" style="padding-top:0;padding-bottom:8px">💭 '+snapGuess(du/dt, dd/dt)+'</td></tr>':'');
    rows++;
  }
  var a0=its[0], b0=its[its.length-1], dtt=(b0.ts-a0.ts)/1000;
  if (dtt>0){
    html+='<tr style="border-top:2px solid var(--line)"><td><b>整体平均</b></td><td class="num">'+(dtt>=60?(dtt/60).toFixed(1)+'分':Math.round(dtt)+'秒')+'</td>'
      +'<td class="num up"><b>'+fmtSpeed((b0.up-a0.up)/dtt)+'</b></td><td class="num dn"><b>'+fmtSpeed((b0.down-a0.down)/dtt)+'</b></td></tr>'
      +'<tr><td colspan="4" class="sub" style="padding-top:0;padding-bottom:8px">💭 '+snapGuess((b0.up-a0.up)/dtt, (b0.down-a0.down)/dtt)+'</td></tr>';
  }
  o.innerHTML = html+'</tbody></table><div class="hint" style="padding:6px 0 0;display:block">速度=两截图累计值之差÷时间差；↑为上传(出) ↓为下载(进)</div>';
}
</script>
</body>
